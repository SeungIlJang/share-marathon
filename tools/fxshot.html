<!DOCTYPE html>
<!-- 연출 점검용: 레이스를 특정 순간까지 시뮬레이션한 뒤 화면을 남긴다.
     ?scene=split|wall|sw|high|cine|fin|result  (헤드리스 Chrome --screenshot, 짧은 virtual-time-budget 권장) -->
<html><head><meta charset="utf-8"><style>html,body{margin:0;height:100%;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block}</style></head>
<body><iframe id="f" src="../marathon-v2.html"></iframe>
<script>
const scene=(location.search.match(/scene=(\w+)/)||[])[1]||'split';
const f=document.getElementById('f');
f.addEventListener('load',()=>setTimeout(()=>{
  const w=f.contentWindow, d=f.contentDocument, g=w.__mv2; w.localStorage.clear(); w.localStorage.setItem('mv2_name','지수');
  d.getElementById('modeRace').click();
  d.querySelector('[data-goal="12600"]').click();
  const km=()=>g.P.pos/10000*42.195;
  const stop={ split:()=>km()>=10.08, wall:()=>km()>=36.2&&g.P.tired, sw:()=>g.P.sw&&g.st.ev.sw&&km()>=g.st.ev.sw+0.15, high:()=>g.P.high>0&&g.P.high<4.8,
               cine:()=>km()>=42.06, fin:()=>g.state==='done', result:()=>false }[scene];
  g.course(0); g.start(); for(let i=0;i<200;i++) g.step(1/60);
  let t=0, cd=0, b0=0;
  while(g.state!=='done'&&!stop()&&t<300){ const P=g.P, k=km(); cd-=1/60;
    let hold=scene==='wall'&&k>35.2?true:(P.stam>45||k>40.2); if(((k%5)>4.6||(k%5)<0.12)&&k>4){ hold=false; if(P.lane===1&&cd<=0){ g.lane(1); cd=0.6; } }
    if(P.stam<25&&scene!=='wall') g.gel(); if(g.st.bumps>b0&&cd<=0){ b0=g.st.bumps; g.lane(P.lane===0?1:-1); cd=1; }
    g.setHold(hold); g.step(1/60); t+=1/60; }
  g.setHold(false);
  if(scene==='result'){ const st=d.createElement('style'); st.textContent='#toast{display:none!important}'; d.head.appendChild(st); }
  else if(scene!=='fin'&&scene!=='cine'){ g.step(1/60); g.pause(); d.getElementById('pause').style.display='none'; }
},500),{once:true});
</script></body></html>
