<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>모두의 마라톤</title>
<meta name="theme-color" content="#8fd0ff">
<style>
  :root{ --ok:#3fca6b; --warn:#ffab2e; --bad:#ff5d6c; --accent:#4aa3ff; --pink:#ff6f9c; --txt:#2b3a4a; --dim:#7a8a9c; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;}
  html,body{margin:0;height:100%;overflow:hidden;background:#8fd0ff;color:var(--txt);touch-action:none;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Malgun Gothic",sans-serif;}
  #scene{position:fixed;inset:0;width:100%;height:100%;display:block;}
  #laneBtns{position:fixed;left:12px;bottom:calc(env(safe-area-inset-bottom) + 14px);display:none;flex-direction:column;gap:10px;z-index:3;}
  .lb{width:62px;height:58px;border-radius:18px;border:3px solid #ffffffcc;background:#2b3a4acc;color:#fff;font-size:26px;font-weight:900;
    display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px #0003;}
  .lb:active{transform:scale(.92);background:#4aa3ff;}
  #gelBtn{position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom) + 14px);display:none;z-index:3;width:74px;height:74px;border-radius:22px;
    border:3px solid #fff;background:linear-gradient(135deg,#ffd23f,#ff9f1c);color:#5a3a00;font-weight:900;font-size:13px;
    flex-direction:column;align-items:center;justify-content:center;box-shadow:0 6px 18px #ff9f1c77;}
  #gelBtn b{font-size:26px;line-height:1;}
  #gelBtn.off{filter:grayscale(1);opacity:.5;}
  #gelBtn:active{transform:scale(.92);}
  .ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:12px;overflow-y:auto;
    padding:calc(env(safe-area-inset-top) + 20px) 20px 24px;text-align:center;z-index:10;background:linear-gradient(160deg,#bfe6ffee,#eaf9eeee);backdrop-filter:blur(4px);}
  .ov h1{margin:0;font-size:30px;}
  .ov p{margin:0;color:#5f7186;line-height:1.5;font-size:14px;max-width:340px;}
  .how{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:100%;max-width:360px;}
  .how div{display:flex;align-items:center;gap:8px;background:#ffffffd9;border-radius:12px;padding:7px 9px;text-align:left;font-size:12px;line-height:1.35;box-shadow:0 3px 10px #7fb0e026;}
  .how b.i{font-size:20px;flex:0 0 24px;text-align:center;}
  .courses{display:flex;flex-direction:column;gap:8px;width:100%;max-width:360px;}
  .crs{display:flex;align-items:center;gap:10px;background:#fff;border:3px solid #e3eaf2;border-radius:16px;padding:9px 12px;text-align:left;cursor:pointer;}
  .crs.sel{border-color:var(--pink);background:#fff1f6;}
  .crs.lock{opacity:.5;filter:grayscale(.7);}
  .crs .ic{font-size:28px;}
  .crs .tx{flex:1;}
  .crs .tx b{font-size:15px;display:block;}
  .crs .tx small{color:var(--dim);font-size:12px;}
  .crs .stars{font-size:14px;letter-spacing:-1px;color:#e0a800;}
  .btn{background:linear-gradient(135deg,#ff8fb4,#ff6f9c);color:#fff;border:none;border-radius:18px;padding:15px 38px;font-size:20px;font-weight:900;box-shadow:0 8px 20px #ff6f9c55;cursor:pointer;}
  .btn.sub{background:#eef3f8;color:var(--txt);box-shadow:none;font-size:16px;padding:12px 26px;}
  .meta{font-size:14px;color:var(--txt);font-weight:700;}
  .medal{font-size:68px;line-height:1;}
  .bigRank{font-size:44px;font-weight:900;}
  .stats{background:#ffffffd9;border-radius:14px;padding:10px 16px;font-size:14px;line-height:1.75;min-width:270px;text-align:left;}
  .stats b{float:right;}
  .splits{font-size:12px;color:var(--dim);max-width:320px;line-height:1.6;}
  .row2{display:flex;gap:8px;width:100%;max-width:360px;}
  .pill{flex:1;border:none;border-radius:14px;padding:10px 8px;font-size:15px;font-weight:900;color:#fff;background:linear-gradient(135deg,#a06bff,#7b3ff2);box-shadow:0 5px 14px #7b3ff244;cursor:pointer;}
  .pill small{display:block;font-size:11px;font-weight:700;opacity:.9;margin-top:2px;}
  #trainBtn{background:linear-gradient(135deg,#3fca6b,#2a9d55);box-shadow:0 5px 14px #2a9d5544;}
  .pill.q{flex:0 0 52px;background:#eef3f8;color:var(--txt);box-shadow:none;}
  .startbar{position:sticky;bottom:-24px;display:flex;gap:8px;align-items:center;justify-content:center;padding:10px 0 24px;width:100%;background:linear-gradient(#e6f6ee00,#e6f6eef2 30%);}
  #medals{width:100%;max-width:360px;background:#ffffffd9;border-radius:14px;padding:6px 10px;}
  .mtitle{font-size:13px;font-weight:900;}
  .mrow{display:flex;justify-content:space-around;font-size:24px;margin-top:2px;}
  .md{filter:grayscale(1);opacity:.35;}
  .md.on{filter:none;opacity:1;}
  .upb{border:none;border-radius:12px;padding:9px 12px;font-weight:900;font-size:14px;background:var(--accent);color:#fff;min-width:74px;cursor:pointer;}
  .upb.no{background:#c7d2de;}
  .upb.max{background:#ffd23f;color:#5a3a00;text-align:center;}
  .lv{color:#3fca6b;font-size:12px;letter-spacing:1px;margin-left:4px;}
  #pauseBtn{position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:50%;transform:translateX(-50%);width:42px;height:38px;border-radius:12px;
    background:#ffffffd9;display:none;align-items:center;justify-content:center;font-size:17px;z-index:4;box-shadow:0 3px 10px #0002;cursor:pointer;}
  #nameIn{width:100%;max-width:320px;border:2px solid #e3eaf2;border-radius:12px;padding:10px 12px;font-size:16px;text-align:center;user-select:text;-webkit-user-select:text;}
  #cert,#pause{z-index:12;}
  #certImg{width:100%;max-width:320px;border-radius:14px;box-shadow:0 8px 24px #0003;}
  #paceChart{background:#ffffffd9;border-radius:12px;width:300px;height:110px;}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="laneBtns"><div class="lb" id="upBtn">▲</div><div class="lb" id="dnBtn">▼</div></div>
<div id="gelBtn"><b>⚡</b><span id="gelTxt">젤 ×1</span></div>
<div id="pauseBtn">⏸</div>

<div class="ov" id="pause" style="display:none">
  <h1>⏸ 일시정지</h1>
  <div class="row2"><button class="pill" id="sndTg">🔊 사운드</button><button class="pill" id="vibTg">📳 진동</button></div>
  <button class="btn" id="resumeBtn">계속 달리기 ▶</button>
  <button class="btn sub" id="quitBtn">레이스 포기 · 메뉴로</button>
</div>

<div class="ov" id="cert" style="display:none">
  <h1>📜 완주 기록증</h1>
  <input id="nameIn" maxlength="10" placeholder="이름을 입력하세요 (기록증 표시)">
  <img id="certImg" alt="완주 기록증">
  <div class="row2"><button class="pill" id="certShare">📤 공유 · 저장</button><button class="pill" id="certClose" style="background:#eef3f8;color:#2b3a4a;box-shadow:none">닫기</button></div>
</div>

<div class="ov" id="menu">
  <h1>🏃 모두의 마라톤</h1>
  <p>서울에서 시작해 <b>월드 마라톤 메이저 6개</b>를 정복하라! 언덕·날씨·급수·젤을 이기고 10명 중 1등으로.</p>
  <div class="how" id="howBox">
    <div><b class="i">👆</b><span><b>꾹</b> = 가속<br>떼면 회복</span></div>
    <div><b class="i">↕️</b><span><b>스와이프/▲▼</b><br>레인 변경</span></div>
    <div><b class="i">🌀</b><span>앞사람 뒤 <b>드래프팅</b><br>빠지면 🚀슬링샷</span></div>
    <div><b class="i">⛰️</b><span><b>업힐</b> 아끼고<br><b>다운힐</b>에서 치고나가기</span></div>
    <div><b class="i">💧</b><span><b>급수대</b>는 옆 레인<br>천천히 지나야 잡힘</span></div>
    <div><b class="i">⚡</b><span><b>파워젤</b> 버튼<br>먹고 3초 뒤 회복</span></div>
  </div>
  <div class="row2"><button class="pill" id="dailyBtn">🗓️ 오늘의 레이스</button><button class="pill" id="trainBtn">🏋️ 훈련<small>능력치 강화</small></button></div>
  <div id="medals"></div>
  <div class="courses" id="courses"></div>
  <div class="meta" id="menuMeta"></div>
  <div class="startbar"><button class="btn" id="startBtn">스타트 🏁</button><button class="pill q" id="howBtn">❓</button></div>
</div>

<div class="ov" id="train" style="display:none">
  <h1>🏋️ 훈련</h1>
  <p>레이스에서 번 코인으로 러너를 단련하세요. 어려운 메이저일수록 훈련이 필요해요.</p>
  <div class="meta" id="trCoin"></div>
  <div class="courses" id="upList"></div>
  <button class="btn sub" id="trClose">돌아가기</button>
</div>

<div class="ov" id="result" style="display:none">
  <div class="medal" id="rMedal">🥇</div>
  <div class="bigRank" id="rRank">1위</div>
  <div style="font-size:26px;color:#e0a800" id="rStars"></div>
  <div class="meta" id="rTime"></div>
  <div id="rMsg" style="font-weight:800;color:var(--pink);max-width:330px"></div>
  <div class="stats" id="rStats"></div>
  <canvas id="paceChart" width="600" height="220"></canvas>
  <div class="splits" id="rSplits"></div>
  <button class="pill" id="certBtn" style="flex:0 0 auto;padding:10px 22px;background:linear-gradient(135deg,#ffd23f,#ff9f1c);color:#5a3a00">📜 완주 기록증 만들기</button>
  <button class="btn" id="againBtn">다시 달리기 🔁</button>
  <button class="btn sub" id="menuBtn">코스 선택</button>
</div>

<script>
(() => {
"use strict";
// ================= 튜닝 =================
const TRACK=10000;            // 레이스 길이(게임 단위). 표시는 42.195km로 환산
const KM=42.195;
const CRUISE=100, SPRINT=148, TIRED=70;   // 속도(단위/초)
const BODY=30, DRAFT=115;     // 충돌 거리 / 드래프팅 유효 거리
const DRAIN=24, REGEN=9, REGEN_DRAFT=26;  // 체력 소모·회복(/초)
const WALL_P=35/KM, KICK_P=40/KM;          // 35km 마의 벽, 40km 라스트 스퍼트
const TIME_K=137;             // 실제 1초 → 표시 137초 (크루즈 약 5'25"/km, 완주 3시간 반 안팎 — 마스터즈 러너 감각)
const CUP_MAX=126;            // 이 속도 넘으면 급수 컵을 놓침
const GEL_DELAY=3, GEL_HEAL=45;
const LANES=3;
const toPos=km=>km/KM*TRACK, toKm=pos=>pos/TRACK*KM;

// 코스: hills = [시작km, 끝km, 경사(+오르막/-내리막)], diff = 라이벌 속도 배율
// w = 날씨(clear·rain·wind·heat), wind = 맞바람 구간[시작km,끝km], major = 월드 마라톤 메이저(식스스타)
const CITY=['#b9d7ef','#a9cbe8','#c6dff2'];
const COURSES=[
  {id:'seoul', ic:'🏙️', n:'서울 마라톤', sub:'도심 평지 · 입문 코스', diff:1.01, w:'clear',
   hills:[[8,10,1],[10,11.5,-1],[24,26,1],[26,27.5,-1]], sky:['#7fc6ff','#d6efff'], ground:'#7fce89', bld:CITY},
  {id:'chuncheon', ic:'🏞️', n:'춘천 호반 마라톤', sub:'호수를 끼고 오르내리는 언덕', diff:1.03, w:'clear',
   hills:[[5,7,1],[7,9,-1],[14,17,1],[17,19,-1],[27,29,1],[29,31,-1],[37,38.5,1]], sky:['#8fd3f0','#e3f6ff'], ground:'#6fc27c', bld:['#9cc7a6','#86b894','#b0d6b8'], lake:true},
  {id:'tokyo', ic:'🗼', n:'도쿄 마라톤', sub:'⭐메이저 · 비 내리는 도심, 물웅덩이 주의', diff:1.045, w:'rain', major:1,
   hills:[[12,13.5,1],[13.5,15,-1],[36,38,1],[38,39,-1]], sky:['#9fb4c8','#dde6ee'], ground:'#7fb889', bld:['#c8ccd8','#b4bccb','#d8dce6']},
  {id:'berlin', ic:'🏛️', n:'베를린 마라톤', sub:'⭐메이저 · 세계기록의 평지 — 라이벌이 빠르다', diff:1.06, w:'clear', major:1,
   hills:[[20,21,1],[21,22,-1]], sky:['#86c2f0','#e8f4ff'], ground:'#86c98e', bld:['#d6c6a8','#c2b08e','#e4d8c0']},
  {id:'chicago', ic:'🌬️', n:'시카고 마라톤', sub:'⭐메이저 · 바람의 도시, 맞바람엔 드래프팅', diff:1.065, w:'wind', major:1,
   hills:[[17,18,1],[18,19,-1]], wind:[[9,15],[25,32]], sky:['#7fb6e8','#dff0ff'], ground:'#7fc48a', bld:['#a8b8cc','#93a6be','#bccadb']},
  {id:'london', ic:'🎡', n:'런던 마라톤', sub:'⭐메이저 · 템스강변, 비와 완만한 언덕', diff:1.075, w:'rain', major:1,
   hills:[[6,8,1],[8,10,-1],[19,21,1],[21,22.5,-1],[33,34.5,1]], sky:['#a2b2c2','#e2e8ee'], ground:'#76b483', bld:['#c9b5a0','#b39e88','#d8c8b6'], lake:true},
  {id:'boston', ic:'🦞', n:'보스턴 마라톤', sub:'⭐메이저 · 폭염 속 32km 하트브레이크 힐', diff:1.085, w:'heat', major:1,
   hills:[[2,6,-1],[25,27,1],[28,29.5,1],[31,33.5,1],[33.5,36,-1]], sky:['#f0c27a','#fff1d6'], ground:'#a7c47a', bld:['#c9a98c','#b8917a','#d9c0a8']},
  {id:'nyc', ic:'🗽', n:'뉴욕 마라톤', sub:'⭐메이저 · 5개 다리와 강바람, 최종 보스', diff:1.10, w:'wind', major:1,
   hills:[[1,3,1],[3,4,-1],[13,14,1],[14,15,-1],[24,26,1],[26,27,-1],[33,34.5,1],[34.5,35.5,-1],[39,41,1]], wind:[[1,4],[24,27],[33,35.5]], sky:['#8eb0dc','#eaeef6'], ground:'#7fbf88', bld:['#9aa6b8','#8494aa','#b2bccb']},
];
const WEATHER={ clear:{ic:'☀️',n:'맑음'}, rain:{ic:'🌧️',n:'비'}, wind:{ic:'🌬️',n:'강풍'}, heat:{ic:'🥵',n:'폭염'} };

// 훈련(영구 성장): 코인으로 능력치 강화
const UPS=[
  {id:'end', ic:'🫀', n:'지구력', d:'가속할 때 체력 소모 -4%', max:5},
  {id:'spd', ic:'👟', n:'스피드', d:'가속 속도 +2 · 기본 속도 +0.4', max:5},
  {id:'rec', ic:'💤', n:'회복력', d:'회복 속도 +6%', max:5},
  {id:'gel', ic:'⚡', n:'젤 벨트', d:'출발 시 파워젤 +1', max:2},
];
const UP_COST=[40,90,160,260,400];

const RIVALS=[
  {n:'번개',     c:'#ffb020', f:p=>p<0.45?121:121-(p-0.45)*58, say:['벌써 따라왔어?','헉… 헉…','초반에 너무 달렸나…']},
  {n:'질주왕',   c:'#e0403c', f:p=>110,                         say:['제법인데?','다시 간다!','어림없지!'], pride:0.6},
  {n:'페이서',   c:'#3fa0ff', pacer:'3:30', f:p=>(TRACK/(12600/TIME_K))/course.diff, say:['3시간 30분 페이스 유지 중!','같이 가요~ 따라오세요!']},  // 🎈 3:30 페이스메이커(코스 무관 일정 속도)
  {n:'스퍼터',   c:'#9a5cff', f:p=>p<0.8?101:138,               say:['막판에 보자고','후후, 아직이야'], pride:0.4},
  {n:'방해꾼',   c:'#3a404c', f:p=>108, block:true,             say:['쳇!','못 지나가게 할 줄 알았는데'], pride:0.5},
  {n:'바람돌이', c:'#18b89a', f:(p,t)=>106+10*Math.sin(t/2.6),  say:['바람이 안 도와주네','휘이~']},
  {n:'철인',     c:'#ff6f9c', f:p=>107.5,                       say:['아직 멀었어','좋은 페이스!'], pride:0.35},
  {n:'거북이',   c:'#7d9a3c', f:p=>100+p*12,                    say:['천천히, 꾸준히','나중에 보자~']},
  {n:'완주요정', c:'#ff8a3c', f:p=>102,                         say:['완주가 목표야!','파이팅~!']},
];

// ================= 기본 =================
const $=id=>document.getElementById(id);
const cvs=$("scene"), ctx=cvs.getContext("2d");
let W=0,H=0,DPR=1,PX=2;
function resize(){ DPR=Math.min(2,window.devicePixelRatio||1); W=innerWidth; H=innerHeight;
  cvs.width=W*DPR; cvs.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); PX=Math.max(1.6,Math.min(3,W/200)); }
addEventListener("resize",resize); resize();
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const store={ get:(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:v;}catch(e){return d;}}, set:(k,v)=>{try{localStorage.setItem(k,String(v));}catch(e){}} };
const rr=(x,y,w,h,r)=>{ ctx.beginPath(); if(ctx.roundRect)ctx.roundRect(x,y,w,h,r); else ctx.rect(x,y,w,h); };

// ================= 스프라이트 =================
const SPR_N=14;
const img=new Image(); img.src='runner-sprite.png';
const tints={};
img.onload=()=>{ for(const r of RIVALS){
  const c=document.createElement('canvas'); c.width=Math.round(img.width/2); c.height=Math.round(img.height/2);
  const x=c.getContext('2d'); x.drawImage(img,0,0,c.width,c.height);
  x.globalCompositeOperation='source-atop'; x.globalAlpha=0.55; x.fillStyle=r.c; x.fillRect(0,0,c.width,c.height);
  tints[r.c]=c; } };

// ================= 사운드 =================
let actx=null;
function audio(){ try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==="suspended")actx.resume(); }catch(e){} }
let sndOn=store.get('mv2_snd','1')==='1', vibOn=store.get('mv2_vib','1')==='1';
function beep(freq,dur,type,vol,slide){ if(!actx||!sndOn)return; try{ const o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime;
  o.type=type||'sine'; o.frequency.setValueAtTime(freq,t); if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||0.18,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+dur+0.02);}catch(e){} }

function update(dt){
  if(state==='pause')return;

    if(after!==before&&after>0)sfx.count();

      for(let i=0;i<70;i++) fx.push({x:rand(0,W),y:rand(-60,40),vx:rand(-2,2),vy:rand(-1,2),life:1.8,col:pick(['#ff6f9c','#ffd23f','#4aa3ff','#3fca6b','#fff'])}); }

  }
  if(state!=='race'){ animOnly(dt); return; }

  if(wall&&!hint.wall){ hint.wall=1; showBanner("🧱 35km 마의 벽","회복이 절반! 드래프팅·젤로 버텨",'#c0303a'); shake=10; buzz(80); }
  if(kick&&!hint.kick){ hint.kick=1; showBanner("🔥 40km 라스트 스퍼트","체력 소모 절반 — 다 쏟아부어!",'#ff6a00'); shake=10; buzz(80); }

  // --- 지형 ---

  if(gr!==st.lastGrade){ st.lastGrade=gr;
    if(gr>0){ const h=course.hills.find(h=>km>=h[0]&&km<h[1]); const isHB=course.id==='boston'&&h&&h[0]===31;
      showBanner(isHB?"💔 하트브레이크 힐!":"⛰️ 업힐 "+(h?(h[1]-h[0]).toFixed(1):"")+"km","속도↓ 체력소모↑ — 무리하지 말고 버텨",isHB?'#8a1f3a':'#9a6a2a'); }
    else if(gr<0) showBanner("⬇️ 다운힐","속도↑ 체력소모↓ — 지금이 치고 나갈 때!",'#2a8ac0');
    else if(raceT>2) pop("🛣️ 평지",'#2b3a4a'); }
  // 🌬️ 맞바람 구간

  if(nextHill&&!hint['hw'+nextHill[0]]){ hint['hw'+nextHill[0]]=1; pop("⛰️ 1km 앞 오르막 — 체력 챙겨요",'#9a6a2a'); }

  if(ns){ ns.warn=1; pop("💧 급수대 "+Math.round(toKm(ns.pos-P.pos)*1000)+"m 앞 — 바깥 레인으로!",'#1f7ac0'); }
  // 5km 스플릿
  const sk=Math.floor(km/5)*5;
  if(sk>st.lastSplit&&sk>0){ st.lastSplit=sk; const tt=raceT*TIME_K; st.splits.push({km:sk,t:tt,rk:rank()});
    pop("📍 "+sk+"km 통과 · "+fmtClock(tt)+" · "+rank()+"위",'#2b3a4a'); }

  // --- 플레이어 ---

  const sprint=holding()&&!P.tired&&!(P.cramp>0);

  const uS=upLv('spd'), wDrain=(wnd&&!P.draft?1.25:1)*(weather==='heat'?1.15:1), wRegen=(weather==='heat'?0.85:1)*(wnd&&P.draft?1.3:1);

  if(P.gelT>0){ P.gelT-=dt; if(P.gelT<=0){ P.stam+=GEL_HEAL; P.tired=false; pop("⚡ 에너지 충전! 체력 +"+GEL_HEAL,'#ff9f1c',true); sfx.boost();
      burst(W*0.3,laneFoot(P.laneF)-70,'#ffd23f',18,5); shake=5; } updateGelBtn(); }
  P.stam=clamp(P.stam,0,100);
  if(P.draft&&P.ahead&&P.ahead.pacer&&!hint.pacer){ hint.pacer=1; pop("🎈 3:30 페이스 그룹 합류! 따라가면 서브3:30",'#3fa0ff'); }
  if(P.draft){ st.draftT+=dt; if(!hint.draft){hint.draft=1; pop("🌀 드래프팅! 회복↑ · 빠지면 슬링샷",'#2aa0e0');} }
  if(P.stam<=0&&!P.tired){ P.tired=true; pop("😵 퍼졌다! 손 떼고 회복"+(P.gels>0?" (젤!)":""),'#ff5d6c',true); sfx.bad(); buzz(60); }

    showBanner("🦵 쥐가 났다!!","화면을 빠르게 연타해서 풀어요!",'#c0303a'); sfx.bad(); shake=10; buzz(150); }
  P.pos+=P.speed*dt;
  if(ahead){ const g=ahead.pos-P.pos;
    if(g<BODY&&P.speed>ahead.speed*0.97){ P.pos=ahead.pos-BODY; P.speed=ahead.speed*0.92;

        pop(hint.bump?"💥 막혔다!":"💥 막혔다! ▲▼ 레인 바꿔 추월",'#ff5d6c'); hint.bump=1; } } }
  const prevPh=P.phase; P.phase+=dt*(P.speed/100)*20;

  // --- 아이템 ---
  for(const it of items){ if(it.used)continue; const d=it.pos-P.pos;
    if(Math.abs(d)<16&&Math.abs(P.laneF-it.lane)<0.5){ const hx=W*0.3, hy=laneFoot(P.laneF)-70;
      if(it.type==='water'){ if(it.st.got)continue; it.used=true;
        if(P.speed>CUP_MAX){ st.miss++; pop("💦 너무 빨라 컵을 놓쳤다!",'#ff5d6c'); sfx.bad(); }
        else { const wh=weather==='heat'?45:30; it.st.got=true; P.stam=Math.min(100,P.stam+wh); if(P.tired&&P.stam>=30)P.tired=false; st.water++;
          pop("🥤 꿀꺽! 체력 +"+wh,'#1f9ae0'); sfx.water(); burst(hx,hy,'#5bbdff',14); } }
      else if(it.type==='gel'){ it.used=true; P.gels++; updateGelBtn(); pop("⚡ 파워젤 획득! (×"+P.gels+")",'#ff9f1c',true); sfx.boost(); burst(hx,hy,'#ffd23f',12); }
      else if(it.type==='sponge'){ it.used=true; P.hr-=18; P.stam=Math.min(100,P.stam+12); st.sponge++; pop("🧽 시원하다! 심박 ↓ 체력 +12",'#1f9ae0'); sfx.water(); burst(hx,hy,'#bfe9ff',12); }
      else if(it.type==='five'){ it.used=true; P.boost=Math.max(P.boost,1.2); st.coins+=2; st.five++; pop("🙌 관중과 하이파이브! +2🪙",'#ff7a2f'); sfx.pass(); burst(hx,hy-20,'#ffd23f',10); }
      else if(it.type==='cheer'){ it.used=true; P.boost=2.2; pop("📣 응원 부스트!!",'#ff7a2f',true); sfx.boost(); burst(hx,hy,'#ffd23f',16,5); shake=5; }
      else { it.used=true; if(P.fever>0){ pop("🔥 피버로 돌파!",'#ff7a2f'); continue; }
        P.stumble=0.6; P.speed*=0.6; st.streak=0; pop(it.type==='puddle'?"💦 미끄덩!":"🚧 꽈당!",'#ff5d6c'); sfx.bad(); shake=7; buzz(50); } } }

  // --- 라이벌 ---
  for(const r of R){
    const rp=clamp(r.pos/TRACK,0,1); let rt=r.f(rp,raceT)*course.diff;

    for(const o of R){ if(o===r||Math.abs(o.laneF-r.lane)>0.45)continue; const g=o.pos-r.pos; if(g>0&&g<bg){bg=g;blk=o;} }
    if(Math.abs(P.laneF-r.lane)<0.45){ const g=P.pos-r.pos; if(g>0&&g<bg){bg=g;blk=P;} }
    r.lc-=dt;
    if(blk&&bg<BODY+14&&rt>blk.speed){
      if(r.lc<=0){ const nl=freeLane(r); if(nl!=null){ r.lane=nl; r.lc=1.3; } else rt=Math.min(rt,blk.speed); }
      else rt=Math.min(rt,blk.speed);
    }
    if(r.block&&!r.fin&&r.lc<=0&&d>BODY+6&&d<95&&Math.abs(r.lane-P.lane)===1&&Math.random()<dt*1.2){
      if(laneFree(P.lane,r,r.pos)){ r.lane=P.lane; r.lc=3.5; say(r,"😈 비켜!"); pop("😈 방해꾼이 끼어들었다!",'#3a404c'); }
    }
    r.speed+=(rt-r.speed)*Math.min(1,dt*2);
    r.pos+=r.speed*dt;
    if(blk&&blk!==P&&Math.abs(blk.laneF-r.laneF)<0.45&&blk.pos-r.pos<BODY&&blk.pos>r.pos) r.pos=blk.pos-BODY;
    r.laneF+=(r.lane-r.laneF)*Math.min(1,dt*6);
    r.phase+=dt*(r.speed/100)*20;
    if(r.bub){ r.bub.t+=dt; if(r.bub.t>1.8)r.bub=null; }
    if(!r.fin&&r.pos>=TRACK){ r.fin=true; finOrder.push(r); if(!tapeBy){ tapeBy=r; if(P.pos>TRACK-400)pop("🎀 "+r.n+"이(가) 테이프를 끊었다!",'#8496a8'); } }
    // 추월 판정
    const isAhead=r.pos>P.pos;
    if(r.wasAhead&&!isAhead&&raceT>1.2){ st.pass++; st.coins+=(P.fever>0?2:1);
      st.streak=(raceT-st.lastPass<4)?st.streak+1:1; st.lastPass=raceT; st.bestStreak=Math.max(st.bestStreak,st.streak);
      const lbl=st.streak>=3?"🔥 "+st.streak+"연속 추월!":st.streak===2?"⚡ 더블 추월!":"🏃 "+r.n+" 추월!";
      pop(lbl+"  "+rank()+"위",'#ff7a2f',st.streak>=2); sfx.pass(); burst(W*0.3,laneFoot(P.laneF)-80,'#ffd23f',10); shake=Math.max(shake,st.streak>=2?6:3);
      say(r,pick(r.say));
      // 자존심 센 라이벌은 반격 스퍼트
      if(r.pride&&!r.fin&&Math.random()<r.pride){ r.surge=2.2; setTimeout(()=>{ if(state==='race')say(r,"🔥 반격이다!"); },500); }
      // 🔥 피버: 3연속 추월 → 4초간 체력 무소모 + 장애물 무시 + 코인 2배
      if(st.streak===3){ P.fever=4; st.fever++; showBanner("🔥 FEVER!!","4초간 체력 무한 · 코인 2배",'#ff3b6b'); sfx.fever(); shake=10; buzz(60); }
    }
    else if(!r.wasAhead&&isAhead&&raceT>1.2){ st.passed++; pop(r.n+"에게 추월당함 · "+rank()+"위",'#8496a8'); sfx.passed(); if(Math.random()<0.5)say(r,"먼저 갈게~"); }
    r.wasAhead=isAhead;
  }

  // 👻 고스트용 주행 기록(0.5초 간격)
  recT+=dt; if(recT>=0.5){ recT-=0.5; rec.push(Math.round(P.pos)); }
  const gp=ghostPos(raceT);
  if(gp!=null&&!hint.ghost&&raceT>3){ hint.ghost=1; pop("👻 내 최고기록 고스트와 함께 달려요",'#7a8a9c'); }
  // --- 결승 ---
  const nearRival=R.some(r=>!r.fin&&Math.abs(r.pos-P.pos)<40);

  if(slowmo&&!hint.photo){ hint.photo=1; pop("📸 포토피니시!!",'#ff3b6b',true); shake=8; }
  if(P.pos>=TRACK){ if(!tapeBy){ tapeBy=P; pop("🎀 테이프 컷!! 우승!!",'#ff3b6b',true); shake=12; burst(W*0.3,laneFoot(P.laneF)-60,'#ff3b6b',30,7); } finish(); }
  if(raceT>0.5&&!hint.hold){ hint.hold=1; pop("👆 꾹 누르면 가속!",'#2b3a4a'); }
  if(raceT>6&&!hint.lane){ hint.lane=1; pop("↕️ 스와이프로 레인 변경",'#2b3a4a'); }
  if(P.stam<35&&P.gels>0&&!hint.gel&&!P.tired){ hint.gel=1; pop("⚡ 체력 부족! 오른쪽 아래 파워젤",'#ff9f1c'); }

function animOnly(dt){ if(state==='menu'){ cam+=CRUISE*dt; P.pos=cam; P.phase+=dt*20; } else { for(const r of R)r.phase+=dt*3; P.phase+=dt*3; } tickFx(dt); }
function tickFx(dt){
  for(let i=fx.length-1;i>=0;i--){ const f=fx[i]; f.vy+=0.3; f.x+=f.vx; f.y+=f.vy; f.life-=dt*1.6; if(f.life<=0)fx.splice(i,1); }
  for(let i=pops.length-1;i>=0;i--){ pops[i].t+=dt; if(pops[i].t>1.5)pops.splice(i,1); }
  if(banner){ banner.t+=dt; if(banner.t>2.6)banner=null; }
  shake*=Math.pow(0.02,dt);
}
function laneFree(l,self,pos){ if(R.some(o=>o!==self&&Math.abs(o.laneF-l)<0.6&&Math.abs(o.pos-pos)<BODY+6))return false;
  if(Math.abs(P.laneF-l)<0.6&&Math.abs(P.pos-pos)<BODY+6)return false; return true; }
function freeLane(r){ const c=[r.lane-1,r.lane+1].filter(l=>l>=0&&l<LANES).sort(()=>Math.random()-0.5);
  for(const l of c) if(laneFree(l,r,r.pos)) return l; return null; }
const rank=()=>1+R.filter(r=>r.pos>P.pos).length;

// ================= 렌더 =================
const roadTop=()=>H*0.44, roadBot=()=>H*0.78, laneH=()=>(roadBot()-roadTop())/LANES;
const laneFoot=l=>roadTop()+(l+0.5)*laneH()+laneH()*0.32;
const laneScale=l=>0.84+0.08*l;
const wx=pos=>W*0.3+(pos-cam)*PX;
function repX(x,period){ x%=period; return x<0?x+period:x; }
const SKY=[]; for(let i=0;i<14;i++)SKY.push({w:rand(40,90),h:rand(60,170),k:i%3});
const HILLS=[]; for(let i=0;i<8;i++)HILLS.push({r:rand(110,190),k:i});

function drawRunner(src,x,foot,h,phase,tag,tagCol,me){
  const bo=Math.abs(Math.sin(phase/SPR_N*Math.PI*2))*h*0.05;
  ctx.fillStyle="#0000002a"; ctx.beginPath(); ctx.ellipse(x,foot+2,h*0.2,h*0.05,0,0,7); ctx.fill();
  if(src&&(src.width||src.naturalWidth)){
    const sw=(src.naturalWidth||src.width)/SPR_N, sh=(src.naturalHeight||src.height), fi=Math.floor(phase)%SPR_N;
    const dw=h*sw/sh; ctx.drawImage(src,fi*sw,0,sw,sh,x-dw/2,foot-h-bo+h*0.02,dw,h);
  } else {
    ctx.fillStyle=tagCol||'#ff5147'; ctx.beginPath(); ctx.arc(x,foot-h*0.75-bo,h*0.18,0,7); ctx.fill(); ctx.fillRect(x-h*0.1,foot-h*0.6-bo,h*0.2,h*0.5);
  }
  if(tag){ ctx.font=(me?"900 14px":"bold 12px")+" sans-serif"; ctx.textAlign="center";
    const ty=foot-h-bo-6, tw=ctx.measureText(tag).width+12;
    ctx.fillStyle=me?"#ffd23f":"#ffffffd0"; rr(x-tw/2,ty-15,tw,19,9); ctx.fill();

}
function bubble(x,y,txt){ ctx.font="bold 13px sans-serif"; const w=ctx.measureText(txt).width+16;

  ctx.fillStyle="#2b3a4a"; ctx.textAlign="center"; ctx.fillText(txt,x,y-29); }

const DROPS=[]; for(let i=0;i<70;i++)DROPS.push({x:Math.random(),y:Math.random(),v:rand(0.8,1.3)});
function drawWeather(rt){
  if(state==='menu')return;
  const t=performance.now()/1000;
  if(weather==='rain'){ ctx.fillStyle="#3a506822"; ctx.fillRect(0,0,W,H); ctx.strokeStyle="#ffffff88"; ctx.lineWidth=1.5;
    for(const d of DROPS){ const y=((d.y+t*d.v*1.3)%1)*H, x=((d.x-t*0.15*d.v)%1+1)%1*W; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x-4,y+14); ctx.stroke(); } }
  else if(weather==='heat'){ const g=ctx.createLinearGradient(0,0,0,rt); g.addColorStop(0,"#ff9a3c33"); g.addColorStop(1,"#ff9a3c00"); ctx.fillStyle=g; ctx.fillRect(0,0,W,rt);

  if(windAt(cam)){ ctx.strokeStyle="#ffffffaa"; ctx.lineWidth=2; ctx.lineCap="round";

      ctx.globalAlpha=0.55; ctx.beginPath(); ctx.moveTo(x,y); ctx.quadraticCurveTo(x+20,y-6,x+46,y); ctx.stroke(); } ctx.globalAlpha=1; }
}

  else for(let i=0;i<SKY.length;i++){ const b=SKY[i], x=repX(i*80-cam*PX*0.12,SKY.length*80)-80;

    ctx.fillStyle="#ffffff55"; for(let yy=rt-b.h-18;yy<rt-34;yy+=16)for(let xx=x+8;xx<x+b.w-10;xx+=14)ctx.fillRect(xx,yy,6,8); }

    ctx.fillStyle="#e8e2d0"; ctx.fillRect(x0,rt-30,x1-x0,10); ctx.fillStyle="#b9a98a"; ctx.fillRect(x0+4,rt-20,4,14); ctx.fillRect(x1-8,rt-20,4,14);
    ctx.fillStyle="#cfe9ff"; for(let xx=x0+8;xx<x1-8;xx+=11) ctx.fillRect(xx,rt-37,7,8);
    // 자원봉사자

  // 결승선
  { const x=wx(TRACK); if(x>-60&&x<W+60){ const sz=lh/4;
      for(let yy=0;yy<(rb-rt)/sz;yy++)for(let c=0;c<2;c++){ ctx.fillStyle=(yy+c)%2?"#fff":"#222"; ctx.fillRect(x+c*sz-sz,rt+yy*sz,sz,sz); }
      ctx.fillStyle="#ff3b6b"; ctx.fillRect(x-4,rt-110,8,110); ctx.fillRect(x-48,rt-132,96,26);
      ctx.fillStyle="#fff"; ctx.font="900 16px sans-serif"; ctx.textAlign="center"; ctx.fillText("FINISH",x,rt-113);

function fmtClock(s){ s=Math.floor(s); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60; return h+":"+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0"); }

    if(store.get('mv2_daily','')!==dayKey()){ const last=store.get('mv2_daily',''); const y=new Date(); y.setDate(y.getDate()-1);
      const yk=y.getFullYear()+"-"+(y.getMonth()+1)+"-"+y.getDate(); let sk=parseInt(store.get('mv2_streak','0'))||0; sk=(last===yk)?sk+1:1;
      const bonus=50+Math.min(50,(sk-1)*10); earned+=bonus; store.set('mv2_daily',dayKey()); store.set('mv2_streak',sk);

      msg.push(bestT?"⏱️ PB 경신! "+fmtClock(bestT-time)+" 단축 — 고스트 갱신":"⏱️ 첫 완주 기록 — 다음 판부터 👻 고스트와 경쟁"); }

  if(sub){ msg.unshift("🏅 "+sub+" 달성!"); const kS='mv2_sub_'+sub; if(!store.get(kS,'')){ store.set(kS,'1'); coins+=20; store.set('mv2_coins',coins); msg[0]+=" (첫 달성 +20🪙)"; } }

  if(finalRank>3) msg.push(st.water<3?"💡 급수대에서 물을 챙기면 후반이 편해져요":st.draftT<15?"💡 앞사람 뒤에 붙어 바람을 피해 보세요":coins>=UP_COST[0]?"💡 🏋️ 훈련에서 능력치를 올려 보세요":"💡 업힐에서 아끼고 다운힐에서 치고 나가 보세요");

  $("rTime").textContent=course.ic+" "+course.n+" · "+WEATHER[weather].ic+" · 완주 "+fmtClock(time);
  $("rMsg").innerHTML=msg.join("<br>");
  $("rStats").innerHTML="🏃 추월 <b>"+st.pass+"회 (최대 "+st.bestStreak+"연속)</b><br>🚀 슬링샷 <b>"+st.sling+"회</b><br>🔥 피버 <b>"+st.fever+"회</b><br>🌀 드래프팅 <b>"+st.draftT.toFixed(0)+"초</b><br>💧 급수 <b>"+st.water+"/"+stations.length+(st.miss?" (놓침 "+st.miss+")":"")+"</b><br>⚡ 파워젤 <b>"+st.gels+"개</b>"+(st.cramps?"<br>🦵 쥐 <b>"+st.cramps+"회</b>":"")+(st.five?"<br>🙌 하이파이브 <b>"+st.five+"회</b>":"")+(st.sponge?"<br>🧽 스펀지 <b>"+st.sponge+"회</b>":"")+"<br>🪙 코인 <b>+"+earned+" (보유 "+coins+")</b>";
  drawPaceChart(); $("rSplits").innerHTML="📍 스플릿 · "+st.splits.map(s=>s.km+"K "+fmtClock(s.t)+" ("+s.rk+"위)").join(" · ");
  lastRes={time,rank:finalRank,sub};
  sfx.go(); if(finalRank===1)setTimeout(sfx.fever,300); $("laneBtns").style.display="none"; $("gelBtn").style.display="none"; $("pauseBtn").style.display="none";
  if(finalRank<=3) for(let i=0;i<60;i++) fx.push({x:rand(0,W),y:rand(-40,H*0.3),vx:rand(-2,2),vy:rand(-2,1),life:1.6,col:pick(['#ff6f9c','#ffd23f','#4aa3ff','#3fca6b'])});
  setTimeout(()=>{ $("result").style.display="flex"; },1100);
}
// 📈 5km 구간 페이스 그래프
function segPaces(){ const pts=[{km:0,t:0}].concat(st.splits.map(s=>({km:s.km,t:s.t}))).concat([{km:KM,t:st.finT}]);
  const out=[]; for(let i=1;i<pts.length;i++){ const dk=pts[i].km-pts[i-1].km; if(dk>0.05) out.push({km:pts[i].km,pace:(pts[i].t-pts[i-1].t)/dk}); } return out; }
const fmtPace=s=>{ s=Math.round(s); return Math.floor(s/60)+"'"+String(s%60).padStart(2,"0")+'"'; };
function chart(c,x0,y0,w,h,big){ const ps=segPaces(); if(!ps.length)return; const mn=Math.min(...ps.map(p=>p.pace))-10, mx=Math.max(...ps.map(p=>p.pace))+10, avg=st.finT/KM;
  const bw=w/ps.length; c.textAlign="center";
  ps.forEach((p,i)=>{ const bh=(1-(p.pace-mn)/(mx-mn))*h*0.75+h*0.12, x=x0+i*bw+bw*0.15;   // 빠를수록 높은 막대
    c.fillStyle=p.pace<=avg?"#3fca6b":"#ffab2e"; c.fillRect(x,y0+h-bh,bw*0.7,bh);
    c.fillStyle="#2b3a4a"; c.font=(big?"bold 22px":"bold 18px")+" sans-serif"; c.fillText(fmtPace(p.pace),x+bw*0.35,y0+h-bh-6);
    c.fillStyle="#7a8a9c"; c.font=(big?"20px":"16px")+" sans-serif"; c.fillText(Math.round(p.km)+"K",x+bw*0.35,y0+h+(big?24:20)); }); }
function drawPaceChart(){ const c=$("paceChart").getContext("2d"); c.clearRect(0,0,600,220);
  c.fillStyle="#2b3a4a"; c.font="bold 20px sans-serif"; c.textAlign="left"; c.fillText("📈 구간 페이스 (/km) · 평균 "+fmtPace(st.finT/KM),14,28); chart(c,10,44,580,146,false); }
// 📜 완주 기록증 (공유용 이미지)
let lastRes=null;
function makeCert(){ const cv=document.createElement('canvas'); cv.width=1080; cv.height=1350; const c=cv.getContext('2d');
  const g=c.createLinearGradient(0,0,0,1350); g.addColorStop(0,course.sky[0]); g.addColorStop(1,course.sky[1]); c.fillStyle=g; c.fillRect(0,0,1080,1350);
  c.fillStyle="#ffffffe6"; rrC(c,60,60,960,1230,40); c.fill(); c.strokeStyle="#ffd23f"; c.lineWidth=10; rrC(c,80,80,920,1190,32); c.stroke();
  c.textAlign="center"; c.fillStyle="#ff6f9c"; c.font="900 46px sans-serif"; c.fillText("FINISHER",540,180);
  c.fillStyle="#2b3a4a"; c.font="900 64px sans-serif"; c.fillText(course.ic+" "+course.n,540,270);
  c.fillStyle="#7a8a9c"; c.font="bold 32px sans-serif"; const d=new Date(); c.fillText(d.getFullYear()+"."+(d.getMonth()+1)+"."+d.getDate()+" · "+WEATHER[weather].ic+" "+WEATHER[weather].n+" · 42.195km",540,325);
  c.fillStyle="#2b3a4a"; c.font="900 60px sans-serif"; c.fillText(($("nameIn").value||"러너")+" 님",540,430);
  c.font="900 150px sans-serif"; c.fillStyle="#2b3a4a"; c.fillText(fmtClock(lastRes.time),540,600);
  c.font="900 56px sans-serif"; c.fillStyle=lastRes.rank===1?"#e0a800":"#ff7a2f"; c.fillText((lastRes.rank<=3?["🥇","🥈","🥉"][lastRes.rank-1]:"🏅")+" "+lastRes.rank+"위 / 10"+(lastRes.sub?"  ·  "+lastRes.sub:""),540,690);
  c.fillStyle="#2b3a4a"; c.font="bold 34px sans-serif"; c.fillText("추월 "+st.pass+"회 · 드래프팅 "+st.draftT.toFixed(0)+"초 · 급수 "+st.water+"회 · 평균 "+fmtPace(st.finT/KM)+"/km",540,770);
  c.fillStyle="#f2f6fa"; rrC(c,120,820,840,320,24); c.fill(); chart(c,140,860,800,230,true);
  c.fillStyle="#7a8a9c"; c.font="bold 30px sans-serif"; c.fillText("🏃 모두의 마라톤 · 함께 달려요!",540,1220);
  return cv; }
function rrC(c,x,y,w,h,r){ c.beginPath(); if(c.roundRect)c.roundRect(x,y,w,h,r); else c.rect(x,y,w,h); }
function openCert(){ $("nameIn").value=store.get('mv2_name',''); $("certImg").src=makeCert().toDataURL("image/png"); $("cert").style.display="flex"; }
$("certBtn").addEventListener("click",openCert);
$("nameIn").addEventListener("input",()=>{ store.set('mv2_name',$("nameIn").value); $("certImg").src=makeCert().toDataURL("image/png"); });
$("certClose").addEventListener("click",()=>{ $("cert").style.display="none"; });
$("certShare").addEventListener("click",()=>{ const cv=makeCert(); const txt="🏃 모두의 마라톤 "+course.n+" 완주! "+fmtClock(lastRes.time)+" · "+lastRes.rank+"위";
  cv.toBlob(b=>{ try{ const f=new File([b],"marathon-finisher.png",{type:"image/png"});
      if(navigator.canShare&&navigator.canShare({files:[f]})){ navigator.share({files:[f],title:"완주 기록증",text:txt}).catch(()=>{}); return; } }catch(e){}
    const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download="marathon-finisher.png"; document.body.appendChild(a); a.click(); a.remove();
    if(navigator.share) navigator.share({title:"모두의 마라톤",text:txt,url:"https://seungiljang.github.io/games/marathon.html"}).catch(()=>{}); },"image/png"); });
// ⏸ 일시정지 · 설정
let prevState='race';
function pauseGame(){ if(state!=='race'&&state!=='count')return; prevState=state; state='pause'; holds.clear(); keyHold=false; bgmOn=false; renderToggles(); $("pause").style.display="flex"; }
function resumeGame(){ if(state!=='pause')return; state=prevState; bgmOn=state==='race'; bgmNext=0; $("pause").style.display="none"; }
function renderToggles(){ $("sndTg").textContent=sndOn?"🔊 사운드 ON":"🔇 사운드 OFF"; $("vibTg").textContent=vibOn?"📳 진동 ON":"📴 진동 OFF"; }
$("pauseBtn").addEventListener("pointerdown",e=>{ e.preventDefault(); e.stopPropagation(); pauseGame(); });
$("resumeBtn").addEventListener("click",resumeGame);
$("quitBtn").addEventListener("click",()=>{ $("pause").style.display="none"; bgmOn=false; showMenu(); });
$("sndTg").addEventListener("click",()=>{ sndOn=!sndOn; store.set('mv2_snd',sndOn?'1':'0'); renderToggles(); });
$("vibTg").addEventListener("click",()=>{ vibOn=!vibOn; store.set('mv2_vib',vibOn?'1':'0'); renderToggles(); });
document.addEventListener("visibilitychange",()=>{ if(document.hidden) pauseGame(); });
function showMenu(){ state='menu'; bgmOn=false; $("pauseBtn").style.display="none"; ["result","train","cert","pause"].forEach(id=>$(id).style.display="none"); $("menu").style.display="flex"; $("laneBtns").style.display="none"; $("gelBtn").style.display="none";
  course=COURSES[selIdx]; weather='clear'; renderCourses(); renderMedals(); renderDaily();
  const total=COURSES.reduce((a,c)=>a+starsOf(c.id),0);
  $("howBox").style.display=total>0?"none":"grid";
  $("menuMeta").innerHTML="🪙 "+coins+" · ⭐ "+total+"/"+(COURSES.length*3)+'<div style="font-size:11px;color:#8aa0b4;font-weight:400">v2.3 · 월드 메이저 커리어</div>'; }
$("startBtn").addEventListener("click",()=>startRace(false));
$("dailyBtn").addEventListener("click",()=>startRace(true));
$("againBtn").addEventListener("click",()=>startRace(daily));
$("menuBtn").addEventListener("click",showMenu);
$("trainBtn").addEventListener("click",()=>{ $("menu").style.display="none"; $("train").style.display="flex"; renderTrain(); });
$("trClose").addEventListener("click",showMenu);
$("howBtn").addEventListener("click",()=>{ const h=$("howBox"); h.style.display=h.style.display==="none"?"grid":"none"; });

// ================= 루프 =================
let last=performance.now();
function loop(t){ let dt=Math.min(0.05,(t-last)/1000); last=t; if(slowmo)dt*=0.35; update(dt); render(); requestAnimationFrame(loop); }
newRace(); showMenu(); requestAnimationFrame(loop);
// 디버그/밸런스 테스트용 훅
window.__mv2={ get P(){return P;}, get R(){return R;}, get state(){return state;}, get st(){return st;}, start:startRace, setHold:v=>{keyHold=v;},
  lane:changeLane, gel:useGel, rank, step:dt=>update(dt), get rank0(){return finalRank;}, course:i=>{selIdx=i;course=COURSES[i];}, setUp:(id,l)=>store.set('mv2_up_'+id,l), daily:()=>startRace(true), get coins(){return coins;}, pause:pauseGame, resume:resumeGame, cert:openCert, grade:()=>gradeAt(P.pos) };
})();
</script>
